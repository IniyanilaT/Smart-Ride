<!DOCTYPE html>
<html>

<head>

    <title>SmartRide Hospital</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>

        #hospitalMap {
            height: 400px;
            width: 100%;
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }

        #hospital2Button {
            display: none;
        }

    </style>

</head>


<body>

    <h1>🏥 SmartRide Hospital Receiver</h1>

    <h2>Emergency Status</h2>

    <p id="status">
        🟢 Waiting for emergency...
    </p>

    <p id="emergencyTime"></p>

    <p id="escalationStatus">
        No escalation required.
    </p>

    <p id="escalationTimer"></p>

    <button onclick="alert('Button is working'); enableNotifications();">
    🔔 Enable Phone Notifications
</button>


    <button id="acceptButton"
            onclick="hospitalAccept()">
        ACCEPT EMERGENCY
    </button>


    <button id="hospital2Button"
            onclick="hospital2Accept()">
        ACCEPT — HOSPITAL 2
    </button>


    <h2>Rider Location</h2>

    <p id="location">
        Waiting for rider location...
    </p>

    <div id="hospitalMap"></div>
   

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    let emergencyNotificationSent = false;
    <script>

        let hospitalMap = null;

        let riderMarker = null;

        let escalationStarted = false;

        let escalationSeconds = 10;

        let escalationTimer = null;
        let emergencyNotificationSent = false;

async function enableNotifications() {

    if (!("Notification" in window)) {
        alert("Notifications are not supported in this browser.");
        return;
    }

    alert("Current notification permission: " + Notification.permission);

    const permission = await Notification.requestPermission();
    


    alert("New notification permission: " + permission);

}

      async function getEmergencyLocation() {

    try {

        // --------------------------------
        // STEP 1: CHECK EMERGENCY STATUS
        // --------------------------------

        const response =
            await fetch("/hospital-location");

        const data =
            await response.json();


        if (data.status === "EMERGENCY") {


            // --------------------------------
            // STEP 2: SEND PHONE NOTIFICATION FIRST
            // --------------------------------

            if (
                Notification.permission === "granted" &&
                emergencyNotificationSent === false
            ) {

                new Notification(
                    "🚨 SmartRide Emergency Alert",
                    {
                        body:
                            "Accident detected!\n" +
                            "Emergency response required."
                    }
                );

                emergencyNotificationSent = true;

            }


            // --------------------------------
            // STEP 3: SHOW EMERGENCY STATUS
            // --------------------------------

            document.getElementById("status").innerText =
                "🚨 EMERGENCY RECEIVED";


            document.getElementById("emergencyTime").innerText =
                "Emergency received at: " +
                new Date().toLocaleTimeString();


            // --------------------------------
            // STEP 4: START HOSPITAL ESCALATION
            // --------------------------------

            startHospitalEscalation();


            // --------------------------------
            // STEP 5: NOW CHECK RIDER LOCATION
            // --------------------------------

            document.getElementById("location").innerText =
                "Getting rider location...";


            const latitude =
                data.latitude;

            const longitude =
                data.longitude;


            // --------------------------------
            // STEP 6: DISPLAY RIDER LOCATION
            // --------------------------------

            document.getElementById("location").innerText =
                "Rider Location: " +
                latitude.toFixed(6) +
                ", " +
                longitude.toFixed(6);


            // --------------------------------
            // STEP 7: CREATE MAP
            // --------------------------------

            if (hospitalMap === null) {

                hospitalMap =
                    L.map("hospitalMap").setView(
                        [latitude, longitude],
                        15
                    );


                L.tileLayer(
                    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                    {
                        attribution:
                            "&copy; OpenStreetMap contributors"
                    }
                ).addTo(hospitalMap);


                riderMarker =
                    L.marker(
                        [latitude, longitude]
                    ).addTo(hospitalMap);


                riderMarker
                    .bindPopup("🚨 Rider Location")
                    .openPopup();

            }


            // --------------------------------
            // STEP 8: UPDATE MAP
            // --------------------------------

            else {

                riderMarker.setLatLng(
                    [latitude, longitude]
                );

                hospitalMap.setView(
                    [latitude, longitude]
                );

            }

        }

    }

    catch (error) {

        console.error(
            "Hospital Error:",
            error
        );

        document.getElementById("status").innerText =
            "Backend connection failed.";

    }

}
        

        function startHospitalEscalation() {

            if (escalationStarted) {

                return;

            }


            escalationStarted = true;

            escalationSeconds = 10;


            document.getElementById("escalationStatus").innerText =
                "🏥 Hospital 1 notified. Waiting for response...";


            document.getElementById("escalationTimer").innerText =
                "Escalating in " +
                escalationSeconds +
                " seconds";


            escalationTimer =
                setInterval(function () {

                    escalationSeconds--;


                    document.getElementById("escalationTimer").innerText =
                        "Escalating in " +
                        escalationSeconds +
                        " seconds";


                    if (escalationSeconds <= 0) {

                        clearInterval(
                            escalationTimer
                        );


                        document.getElementById("escalationStatus").innerText =
                            "⚠️ No response from Hospital 1. Escalating to Hospital 2.";


                        document.getElementById("escalationTimer").innerText =
                            "🏥 Hospital 2 notified.";


                        document.getElementById("hospital2Button").style.display =
                            "inline-block";

                    }

                }, 1000);

        }


        // --------------------------------
        // HOSPITAL 1 ACCEPT
        // --------------------------------

        function hospitalAccept() {

            clearInterval(
                escalationTimer
            );


            document.getElementById("escalationStatus").innerText =
                "✅ Hospital 1 accepted the emergency.";


            document.getElementById("escalationTimer").innerText =
                "Emergency response confirmed.";


            document.getElementById("acceptButton").disabled =
                true;

        }


        // --------------------------------
        // HOSPITAL 2 ACCEPT
        // --------------------------------

        function hospital2Accept() {

            clearInterval(
                escalationTimer
            );


            document.getElementById("escalationStatus").innerText =
                "✅ Hospital 2 accepted the emergency.";


            document.getElementById("escalationTimer").innerText =
                "Emergency response confirmed.";


            document.getElementById("hospital2Button").disabled =
                true;

        }


        // --------------------------------
        // START MONITORING HOSPITAL
        // --------------------------------

        enableNotifications();

        getEmergencyLocation();


        setInterval(
            getEmergencyLocation,
            2000
        );

    </script>

</body>

</html>
